<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烧录站管理后台 · peipeidev.cn</title>
<style>
:root{--bg:#0e1116;--panel:#151a21;--panel2:#1b2129;--border:#262e39;--text:#d7dfe8;--dim:#8b97a7;--pink:#FB7299;--ok:#4ade80;--warn:#eab308;--err:#ef4444;--blue:#8b9dfc}
*{box-sizing:border-box;margin:0}
body{font:15px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--text)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(560px 560px at -60px -80px,rgba(251,114,153,.16),transparent 70%),radial-gradient(520px 520px at 110% 30%,rgba(139,157,252,.13),transparent 70%)}
main{max-width:1080px;margin:0 auto;padding:16px 20px 60px}
h1{font-size:18px;margin:14px 0 4px}h1 b{color:var(--pink)}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:14px}
.tab.sel{color:#fff;border-color:var(--pink);background:rgba(251,114,153,.16)}
.card{background:rgba(21,26,33,.66);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat b{display:block;font-size:26px;color:#fff}.stat span{font-size:12px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:600}
td.ok{color:var(--ok)}td.bad{color:var(--err)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e05a85,var(--pink))}
input,select,textarea{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px}
button{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}
button.pri{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
button:hover{border-color:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.dim{color:var(--dim);font-size:12px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;border:1px solid}
.tag.u{color:var(--ok);border-color:#2c5c38}.tag.r{color:var(--dim);border-color:var(--border)}.tag.d{color:var(--err);border-color:#6b2b2b}
#login{max-width:380px;margin:80px auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--pink);padding:9px 20px;border-radius:99px;display:none;z-index:9}
.fw{width:100%}
</style>
</head>
<body>
<div id="login" class="card">
  <h1>烧录站管理后台</h1>
  <p class="dim">peipeidev.cn · 在线烧录（统计 / 反馈 / 公告 / 激活码）</p>
  <div class="row"><input id="tk" class="fw" type="password" placeholder="ADMIN_TOKEN" onkeydown="if(event.key==='Enter')login()"></div>
  <div class="row"><button class="pri fw" onclick="login()">进入</button></div>
  <p class="dim" id="lerr"></p>
</div>
<main id="main" hidden>
  <h1>烧录站管理后台 · <b>peipeidev.cn</b></h1>
  <p class="sub">数据源：Cloudflare D1（peipei-flash-db）· <button onclick="logout()" style="padding:2px 10px;font-size:12px;">退出</button></p>
  <div class="tabs">
    <button class="tab sel" data-t="stats" onclick="go('stats')">📊 统计</button>
    <button class="tab" data-t="fb" onclick="go('fb')">💬 反馈</button>
    <button class="tab" data-t="an" onclick="go('an')">📢 公告</button>
    <button class="tab" data-t="code" onclick="go('code')">🔑 激活码</button>
  </div>

  <div id="v-stats">
    <div class="card"><div class="grid" id="scards"></div></div>
    <div class="card"><b>按固件分布</b><div id="sfw" style="margin-top:8px"></div></div>
    <div class="card"><b>失败原因 Top</b><div id="serr" style="margin-top:8px"></div></div>
  </div>

  <div id="v-fb" hidden>
    <div class="card" id="fblist"></div>
  </div>

  <div id="v-an" hidden>
    <div class="card">
      <b id="anTitle">新增公告</b>
      <div class="row"><input id="anT" class="fw" placeholder="标题（如：新固件上线）"></div>
      <div class="row"><textarea id="anB" class="fw" rows="3" placeholder="内容（烧录页顶部公告条显示）"></textarea></div>
      <div class="row"><label class="dim">置顶权重 <input id="anS" type="number" value="0" style="width:70px"></label>
        <label class="dim"><input id="anA" type="checkbox" checked> 上线</label>
        <button class="pri" onclick="saveAn()">保存</button>
        <button onclick="resetAn()" id="anCancel" hidden>取消编辑</button>
        <input type="hidden" id="anId"></div>
    </div>
    <div class="card" id="anlist"></div>
  </div>

  <div id="v-code" hidden>
    <div class="card">
      <b>固件激活码（一机一码）</b>
      <p class="dim">买家提供设备 MAC → 生成绑定该设备的激活码（与 bw16-keygen 同源同算法，固件端离线验证）</p>
      <div class="row">
        <input id="kgTk" placeholder="keygen 访问令牌（BW16_ACCESS_TOKEN）" style="min-width:240px" type="password">
        <button onclick="saveKgTk()">保存令牌</button>
      </div>
      <div class="row">
        <input id="kgMac" placeholder="设备 MAC（如 001A2B3C4D5E 或 00:1A:2B:3C:4D:5E）" style="min-width:280px">
        <button class="pri" onclick="genOne()">生成激活码</button>
      </div>
      <div class="dim" id="kgOut" style="white-space:pre-wrap;user-select:all;color:var(--pink);font-size:16px"></div>
    </div>
    <div class="card"><b>生成记录（keygen D1）</b><div id="kgList" style="margin-top:8px"></div></div>
  </div>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let TK=localStorage.getItem("admin_tk")||"";
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{Authorization:"Bearer "+TK,"Content-Type":"application/json",...(o.headers||{})}});if(r.status===401){logout();throw new Error("token 失效")}return r.json()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ts=t=>new Date(t).toLocaleString("zh-CN",{monthClock:"2-digit",hour12:false});
function toast(m){$("toast").textContent=m;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}

async function login(){TK=$("tk").value.trim();if(!TK)return;try{await api("/api/admin/stats?days=1");localStorage.setItem("admin_tk",TK);$("login").hidden=true;$("main").hidden=false;go("stats")}catch(e){$("lerr").textContent="Token 无效或网络错误"}}
function logout(){TK="";localStorage.removeItem("admin_tk");location.reload()}
if(TK){(async()=>{try{await api("/api/admin/stats?days=1");$("login").hidden=true;$("main").hidden=false;go("stats")}catch{}})()}

function go(t){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("sel",b.dataset.t===t));["stats","fb","an","code"].forEach(v=>$("v-"+v).hidden=v!==t);({stats:loadStats,fb:loadFb,an:loadAn,code:loadKg})[t]()}

async function loadStats(){
  const d=await api("/api/admin/stats?days=30");
  const ok=d.total.ok||0,n=d.total.n||0;
  $("scards").innerHTML=`
    <div class="stat"><b>${n}</b><span>30 天刷写次数</span></div>
    <div class="stat"><b>${n?Math.round(ok/n*100):0}%</b><span>成功率（${ok} 成功）</span></div>
    <div class="stat"><b>${d.feedback.n||0}</b><span>反馈（待处理 ${(d.feedback.n||0)-(d.feedback.handled||0)}）</span></div>
    <div class="stat"><b>${d.byFirmware.length}</b><span>被刷固件数</span></div>`;
  const mx=Math.max(...d.byFirmware.map(x=>x.n),1);
  $("sfw").innerHTML="<table><tr><th>固件</th><th>次数</th><th>成功</th><th></th></tr>"+d.byFirmware.map(x=>`<tr><td>${esc(x.firmware)}</td><td>${x.n}</td><td class=${x.ok==x.n?"ok":"bad"}>${x.ok}/${x.n}</td><td style="width:40%"><div class="bar"><i style="width:${x.n/mx*100}%"></i></div></td></tr>`).join("")+"</table>";
  $("serr").innerHTML=d.topErrors.length?"<table><tr><th>失败原因</th><th>次数</th></tr>"+d.topErrors.map(x=>`<tr><td class="bad">${esc(x.err)}</td><td>${x.n}</td></tr>`).join("")+"</table>":'<p class="dim">暂无失败记录 🎉</p>';
}

async function loadFb(){
  const d=await api("/api/admin/feedback?limit=100");
  $("fblist").innerHTML=d.feedback.length?d.feedback.map(f=>`
    <div style="border-bottom:1px solid var(--border);padding:12px 0;">
      <div><span class="tag ${f.handled?"r":"u"}">${f.handled?"已处理":"待处理"}</span>
        <b style="margin-left:8px">${esc(f.contact||"未留联系方式")}</b>
        <span class="dim" style="margin-left:10px">${ts(f.ts)}</span>
        <button style="float:right;padding:2px 10px;font-size:12px" onclick="handleFb(${f.id},${f.handled?0:1})">${f.handled?"标记待处理":"标记已处理"}</button></div>
      <div style="margin:8px 0">${esc(f.message)}</div>
      ${f.log?`<details><summary class="dim">附刷写摘要</summary><pre class="dim" style="white-space:pre-wrap">${esc(f.log)}</pre></details>`:""}
    </div>`).join(""):'<p class="dim">暂无反馈</p>';
}
async function handleFb(id,v){await api("/api/admin/feedback/handle",{method:"POST",body:JSON.stringify({id,handled:!!v})});loadFb()}

async function loadAn(){
  const d=await api("/api/admin/announcements");
  $("anlist").innerHTML=d.announcements.length?d.announcements.map(a=>`
    <div style="border-bottom:1px solid var(--border);padding:10px 0">
      <span class="tag ${a.active?"u":"r"}">${a.active?"上线":"下线"}</span>
      <b style="margin-left:8px">${esc(a.title)}</b> <span class="dim">权重${a.sort} · ${ts(a.ts)}</span>
      <div class="dim" style="margin:4px 0">${esc(a.body||"")}</div>
      <button style="padding:2px 10px;font-size:12px" onclick='editAn(${JSON.stringify(a)})'>编辑</button>
      <button style="padding:2px 10px;font-size:12px" onclick="toggleAn(${a.id},${a.active?0:1})">${a.active?"下线":"上线"}</button>
    </div>`).join(""):'<p class="dim">暂无公告</p>';
}
function editAn(a){$("anId").value=a.id;$("anT").value=a.title;$("anB").value=a.body||"";$("anS").value=a.sort;$("anA").checked=!!a.active;$("anTitle").textContent="编辑公告 #"+a.id;$("anCancel").hidden=false}
function resetAn(){$("anId").value="";$("anT").value="";$("anB").value="";$("anS").value=0;$("anA").checked=true;$("anTitle").textContent="新增公告";$("anCancel").hidden=true}
async function saveAn(){
  const body={title:$("anT").value.trim(),body:$("anB").value.trim(),sort:Number($("anS").value)||0,active:$("anA").checked};
  if(!body.title)return toast("标题必填");
  if($("anId").value)body.id=Number($("anId").value);
  await api("/api/admin/announcements",{method:"POST",body:JSON.stringify(body)});
  resetAn();loadAn();toast("已保存");
}
async function toggleAn(id,active){await api("/api/admin/announcements",{method:"POST",body:JSON.stringify({id,active:!!active})});loadAn()}

const KG="https://api.peipeidev.cn";
let KGT=localStorage.getItem("kg_tk")||"";
function saveKgTk(){KGT=$("kgTk").value.trim();localStorage.setItem("kg_tk",KGT);toast("keygen 令牌已保存")}
if(KGT)$("kgTk").value=KGT;
const kgApi=async(p,o={})=>{const r=await fetch(KG+p,{...o,headers:{Authorization:"Bearer "+KGT,"Content-Type":"application/json",...(o.headers||{})}});return r.json()};
async function genOne(){
  if(!KGT)return toast("先填 keygen 访问令牌");
  const mac=$("kgMac").value.trim();if(!mac)return toast("先填设备 MAC");
  try{
    const d=await kgApi("/api/generate",{method:"POST",body:JSON.stringify({mac})});
    if(d.error)return $("kgOut").textContent="× "+d.error;
    $("kgOut").textContent=d.result.code+"\n设备："+d.result.mac;
    loadKg();
  }catch(e){$("kgOut").textContent="× 网络错误 "+e.message}
}
async function loadKg(){
  if(!KGT){$("kgList").innerHTML='<p class="dim">填令牌后显示</p>';return}
  try{
    const d=await kgApi("/api/records?limit=50");
    const rs=d.records||d.result||[];
    $("kgList").innerHTML=rs.length?"<table><tr><th>设备 MAC</th><th>激活码</th><th>时间</th></tr>"+rs.map(r=>`<tr><td>${esc(r.mac)}</td><td style="user-select:all;font-family:monospace;color:var(--pink)">${esc(r.code)}</td><td class="dim">${esc(String(r.created_at||r.createdAt||""))}</td></tr>`).join("")+"</table>":'<p class="dim">暂无记录</p>';
  }catch(e){$("kgList").innerHTML='<p class="dim">记录加载失败：'+esc(e.message)+'</p>'}
}
</script>
</body>
</html>
