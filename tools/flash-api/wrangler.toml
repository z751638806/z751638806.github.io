name = "peipei-flash-api"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = false

account_id = "83799c18cdfa00512d34fdeb4a4d7de4"

[[routes]]
pattern = "admin.peipeidev.cn"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "peipei-flash-db"
database_id = "134defac-2a1c-4424-b244-f1996f0ece5b"

# M6 付费固件 bin 实体存储：KV（当前生效，免费无需开通；单值上限 25MiB）
[[kv_namespaces]]
binding = "PICKUP"
id = "f9bca75d2aea42a3ad032011defacc2e"

# 切换 R2（账户开通 R2 后：注释掉上面 kv_namespaces，取消下面注释，重跑 deploy 即可；
# worker.mjs 的取件适配器对两种存储都兼容）
# [[r2_buckets]]
# binding = "PICKUP"
# bucket_name = "peipei-flash-pickup"

[[rules]]
type = "Text"
globs = ["**/*.html"]
