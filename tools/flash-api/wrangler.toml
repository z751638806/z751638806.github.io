name = "peipei-flash-api"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = false

account_id = "83799c18cdfa00512d34fdeb4a4d7de4"

[[routes]]
pattern = "admin.peipeidev.cn"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "peipei-flash-db"
database_id = "134defac-2a1c-4424-b244-f1996f0ece5b"

# M6 付费固件 bin 实体存储（首次部署先 `npx wrangler r2 bucket create peipei-flash-pickup`）
[[r2_buckets]]
binding = "PICKUP"
bucket_name = "peipei-flash-pickup"

[[rules]]
type = "Text"
globs = ["**/*.html"]
